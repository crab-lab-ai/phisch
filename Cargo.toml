[package]
name = "phisch"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.21.0", features = ["wgpu", "train", "tui"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
clap = { version = "4.5", features = ["derive"] }
nobubbles = { git = "https://github.com/romancitodev/nobubbles.git", version = "0.1.1" }
log = "0.4.34"
anyhow = "1.0.104"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
